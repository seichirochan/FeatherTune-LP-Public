<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0628">
<title>FeatherTune Card Maker — 楽曲魅力カード ジェネレーター</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg-0:#050218; --bg-1:#0d0735; --bg-2:#1a0b4e;
    --ink:#f6f3ff; --ink-mute:rgba(246,243,255,.72); --ink-faint:rgba(246,243,255,.5);
    --line:rgba(255,255,255,.14);
    --accent-gold:#f6d27a; --accent-gold-2:#ffb86b;
    --accent-cyan:#7ee8ff; --accent-pink:#ff7ad9;
    --panel:rgba(255,255,255,.05);
    --panel-strong:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--ink);
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;-webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, #4b1e9b 0%, transparent 55%),
      radial-gradient(90% 60% at 90% 15%, #ff7ad910 0%, transparent 60%),
      radial-gradient(80% 60% at 0% 80%, #7ee8ff14 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 40%, var(--bg-2) 100%);
    background-attachment:fixed;
  }

  /* ===== App Shell ===== */
  .app{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
  .app-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .app-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:.06em}
  .app-title .logo{
    width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,var(--accent-gold) 55%,#a86b2c 100%);
    box-shadow:0 0 18px rgba(246,210,122,.6);
  }
  .app-title small{display:block;font-weight:400;font-size:11px;color:var(--ink-mute);letter-spacing:.18em;margin-top:2px}
  .app-head a.lp-mini{
    font-size:11px;color:var(--accent-cyan);letter-spacing:.12em;text-decoration:none;
    border:1px solid rgba(126,232,255,.4);padding:6px 12px;border-radius:999px;
  }
  .app-head a.lp-mini:hover{background:rgba(126,232,255,.08)}

  /* ===== Drop Zone ===== */
  .drop{
    position:relative;display:block;width:100%;
    border:2px dashed rgba(255,255,255,.25);border-radius:18px;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    padding:28px 24px;text-align:center;cursor:pointer;
    transition:border-color .2s, background .2s, transform .15s;
    margin-bottom:18px;
  }
  .drop:hover{border-color:rgba(126,232,255,.55);background:rgba(126,232,255,.05)}
  .drop.drag{border-color:var(--accent-cyan);background:rgba(126,232,255,.10);transform:scale(1.01)}
  .drop .ico{font-size:38px;line-height:1;margin-bottom:10px;display:block}
  .drop .ttl{font-size:15px;font-weight:700;letter-spacing:.04em;display:block}
  .drop .sub{font-size:12px;color:var(--ink-mute);margin-top:6px;letter-spacing:.04em;display:block}
  .drop .pick-btn{
    display:inline-block;margin-top:14px;padding:8px 18px;border-radius:999px;
    background:rgba(126,232,255,.12);border:1px solid rgba(126,232,255,.45);color:var(--accent-cyan);
    font-size:12px;letter-spacing:.08em;font-weight:700;
  }
  /* visually hidden file input — Safariでも表示崩れしない */
  .visually-hidden{
    position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  /* 読込後インジケーター */
  .loaded-pill{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    padding:4px 12px;border-radius:999px;font-size:11px;letter-spacing:.06em;
    background:rgba(94,234,160,.14);border:1px solid rgba(94,234,160,.4);color:#a8f5c8;
  }

  /* ===== Layout ===== */
  .layout{display:grid;grid-template-columns:1.05fr 480px;gap:22px;align-items:start}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;gap:18px}
    .preview-wrap{position:relative;top:auto}
  }

  /* ===== Editor ===== */
  .editor{
    border-radius:18px;background:var(--panel);border:1px solid var(--line);
    padding:18px 18px 16px;
  }
  .editor h3{
    font-size:11px;letter-spacing:.22em;color:var(--accent-cyan);
    margin:0 0 12px;font-weight:700;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .editor h3::before{content:"";width:14px;height:1.5px;background:var(--accent-cyan)}
  .editor h3:not(:first-of-type){margin-top:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .field label{font-size:10.5px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .field input, .field textarea{
    appearance:none;background:rgba(0,0,0,.28);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px;
    font-family:inherit;outline:none;transition:border-color .15s, background .15s;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent-cyan);background:rgba(0,0,0,.4)}
  .field textarea{min-height:62px;resize:vertical;line-height:1.5}
  .charm-edit{display:grid;gap:10px}
  .charm-edit .item{
    padding:10px 12px;border-radius:12px;
    background:rgba(0,0,0,.22);border:1px solid var(--line);
  }
  .charm-edit .row1{display:grid;grid-template-columns:48px 1fr;gap:8px;margin-bottom:6px}
  .charm-edit .row1 input{padding:8px 10px;font-size:13px;text-align:center}
  .charm-edit textarea{width:100%;min-height:50px}

  /* ===== Preview ===== */
  .preview-wrap{position:sticky;top:14px}
  .preview-frame{
    border-radius:24px;overflow:hidden;
    background:#000;border:1px solid var(--line);
    box-shadow:0 30px 60px -30px rgba(80,40,180,.7);
    max-height:calc(100vh - 40px);overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;
  }
  .preview-frame::-webkit-scrollbar{width:6px}
  .preview-frame::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}

  /* ===== Action Bar ===== */
  .actions{
    margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  }
  .actions.row5{grid-template-columns:repeat(5,1fr)}
  .abtn{
    appearance:none;border:0;cursor:pointer;
    padding:11px 6px;border-radius:12px;color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.04em;
    background:rgba(255,255,255,.07);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:transform .15s, background .2s;
    text-decoration:none;text-align:center;
  }
  .abtn:active{transform:scale(.96)}
  .abtn:hover{background:rgba(255,255,255,.12)}
  .abtn svg{width:18px;height:18px;display:block}
  .abtn.primary{background:linear-gradient(135deg,var(--accent-gold),var(--accent-gold-2));color:#1a0a35}
  .abtn.x{background:#000;border-color:#333}
  .abtn.line{background:linear-gradient(135deg,#06c755,#04a847)}
  .abtn.ig{background:linear-gradient(135deg,#feda77,#f58529 30%,#dd2a7b 60%,#8134af 90%,#515bd4)}

  /* ===== Card (Preview & Export shared) — must mirror standalone HTML ===== */
  .card-stage{
    --c-ink:#f6f3ff; --c-ink-mute:rgba(246,243,255,.72); --c-ink-faint:rgba(246,243,255,.5);
    --c-line:rgba(255,255,255,.14); --c-gold:#f6d27a; --c-gold-2:#ffb86b;
    --c-cyan:#7ee8ff;
    background:
      radial-gradient(120% 70% at 50% -10%, #4b1e9b 0%, transparent 55%),
      radial-gradient(90% 60% at 90% 15%, #ff7ad910 0%, transparent 60%),
      radial-gradient(80% 60% at 0% 80%, #7ee8ff14 0%, transparent 60%),
      linear-gradient(180deg, #050218 0%, #0d0735 40%, #1a0b4e 100%);
    color:var(--c-ink);
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,-apple-system,sans-serif;
    padding:18px 18px 28px;position:relative;
  }
  .card-stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff 99%, transparent 100%),
      radial-gradient(1px 1px at 80% 18%, #fff 99%, transparent 100%),
      radial-gradient(1.2px 1.2px at 35% 60%, #cfe9ff 99%, transparent 100%),
      radial-gradient(1px 1px at 70% 78%, #fff 99%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 12%, #ffd9a8 99%, transparent 100%),
      radial-gradient(1px 1px at 12% 85%, #fff 99%, transparent 100%),
      radial-gradient(1px 1px at 90% 50%, #fff 99%, transparent 100%);
    opacity:.55;
  }
  .card-stage > *{position:relative;z-index:1}
  .c-brand{display:flex;align-items:center;justify-content:space-between;
    font-size:11px;letter-spacing:.18em;color:var(--c-ink-faint);
    text-transform:uppercase;margin-bottom:14px}
  .c-brand .c-logo{display:flex;align-items:center;gap:6px;color:var(--c-gold);font-weight:700}
  .c-brand .c-logo::before{content:"";width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,var(--c-gold) 55%,#a86b2c 100%);
    box-shadow:0 0 12px var(--c-gold)}
  .c-brand .c-rank{color:#0b0628;background:linear-gradient(135deg,var(--c-gold),var(--c-gold-2));
    padding:3px 9px;border-radius:999px;font-weight:800;letter-spacing:.12em}
  .c-hero{position:relative;border-radius:24px;overflow:hidden;padding:26px 22px 22px;
    background:linear-gradient(160deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.02) 60%),
               linear-gradient(140deg,#2a0f6e 0%, #46139e 45%, #7a1faa 100%);
    box-shadow:0 20px 60px -20px rgba(80,40,180,.55), inset 0 1px 0 rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.10)}
  .c-hero::after{content:"";position:absolute;inset:-40% -10% auto auto;width:80%;height:80%;
    background:radial-gradient(circle, rgba(255,200,120,.35) 0%, transparent 60%);filter:blur(10px);pointer-events:none}
  .c-hero > *{position:relative;z-index:1}
  .c-kicker{font-size:10px;letter-spacing:.32em;color:var(--c-cyan);
    text-transform:uppercase;margin-bottom:10px;font-weight:700}
  .c-title{font-size:32px;line-height:1.15;margin:0 0 6px;letter-spacing:.05em;font-weight:800;
    background:linear-gradient(180deg,#ffffff 0%,#e8d6ff 60%,#c7a6ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 20px rgba(180,140,255,.35);word-break:break-word}
  .c-artist{font-size:13px;color:var(--c-ink-mute);letter-spacing:.08em}
  .c-summary{margin-top:14px;padding:12px 14px;border-radius:14px;
    background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.10);
    font-size:13.5px;line-height:1.65;color:#f3eaff}
  .c-summary b{color:var(--c-gold)}
  .c-scores{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:14px}
  .c-score{text-align:center;padding:10px 6px;border-radius:12px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
  .c-score.main{background:radial-gradient(circle at 50% 0%, rgba(126,232,255,.35), rgba(255,255,255,.05) 60%);
    border-color:rgba(126,232,255,.55);box-shadow:0 0 22px rgba(126,232,255,.25)}
  .c-score .l{font-size:9.5px;letter-spacing:.18em;color:var(--c-ink-faint);font-weight:700}
  .c-score .n{font-size:24px;font-weight:800;line-height:1.05;margin-top:4px;letter-spacing:.02em}
  .c-score.main .n{font-size:30px;color:#fff;text-shadow:0 0 14px rgba(126,232,255,.55)}
  .c-score .s{font-size:9.5px;color:var(--c-ink-faint);margin-top:2px;letter-spacing:.06em}
  .c-sec{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.24em;
    color:var(--c-cyan);text-transform:uppercase;font-weight:700;margin:22px 4px 10px}
  .c-sec::before{content:"";width:18px;height:1.5px;background:linear-gradient(90deg,var(--c-cyan),transparent)}
  .c-charm{display:grid;gap:10px}
  .c-charm .r{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:14px;
    background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border:1px solid var(--c-line)}
  .c-charm .i{flex:0 0 36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    background:linear-gradient(135deg, rgba(126,232,255,.20), rgba(255,122,217,.18));
    border:1px solid rgba(255,255,255,.12)}
  .c-charm .t{font-size:13.5px;font-weight:700;margin:0 0 3px;color:#fff}
  .c-charm .d{font-size:12px;color:var(--c-ink-mute);line-height:1.55;margin:0}
  .c-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .c-spec{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--c-line)}
  .c-spec .k{font-size:9.5px;letter-spacing:.16em;color:var(--c-ink-faint);font-weight:700;text-transform:uppercase}
  .c-spec .v{font-size:14px;font-weight:700;color:#fff;margin-top:3px;letter-spacing:.03em}
  .c-spec .v small{display:block;font-size:10px;color:var(--c-ink-mute);font-weight:500;margin-top:2px;letter-spacing:.04em}
  .c-lyric{position:relative;margin-top:14px;padding:18px 18px 16px;border-radius:16px;
    background:radial-gradient(120% 90% at 100% 0%, rgba(255,184,107,.18), transparent 60%),
               linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border:1px solid rgba(246,210,122,.28)}
  .c-lyric::before{content:"❝";position:absolute;top:-2px;left:10px;
    font-size:48px;color:var(--c-gold);opacity:.5;line-height:1;font-family:Georgia,serif}
  .c-lyric .p{font-size:16px;line-height:1.7;font-weight:600;color:#fff8e7;
    padding-left:18px;letter-spacing:.04em;white-space:pre-wrap}
  .c-lyric .src{margin-top:8px;padding-left:18px;font-size:10.5px;color:var(--c-ink-faint);letter-spacing:.14em}
  .c-share{margin-top:18px;padding:16px;border-radius:18px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid var(--c-line)}
  .c-share .hd{font-size:11px;letter-spacing:.22em;color:var(--c-ink-mute);
    text-transform:uppercase;font-weight:700;margin-bottom:10px;text-align:center}
  .c-share .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .c-sbtn{display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:11px 4px;border-radius:12px;color:#fff;font-size:10.5px;font-weight:600;
    background:rgba(255,255,255,.06);border:1px solid var(--c-line);text-decoration:none;cursor:pointer}
  .c-sbtn svg{width:22px;height:22px;display:block}
  .c-sbtn.x{background:linear-gradient(135deg,#000,#1a1a1a);border-color:#333}
  .c-sbtn.ig{background:linear-gradient(135deg,#feda77,#f58529 30%,#dd2a7b 60%,#8134af 90%,#515bd4)}
  .c-sbtn.line{background:linear-gradient(135deg,#06c755,#04a847)}
  .c-sbtn.copy{background:linear-gradient(135deg,#3a3a8a,#1f2050)}
  .c-cta{display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:16px;padding:16px 18px;border-radius:16px;
    background:linear-gradient(135deg,var(--c-gold) 0%, var(--c-gold-2) 100%);
    color:#1a0a35;font-weight:800;font-size:15px;letter-spacing:.06em;text-decoration:none;
    box-shadow:0 14px 30px -10px rgba(246,210,122,.55), inset 0 1px 0 rgba(255,255,255,.6)}
  .c-cta-sub{text-align:center;font-size:10.5px;color:var(--c-ink-faint);letter-spacing:.16em;margin-top:8px}
  .c-foot{margin-top:20px;text-align:center;font-size:10px;color:var(--c-ink-faint);letter-spacing:.14em;line-height:1.6}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);
    background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:12.5px;letter-spacing:.06em;z-index:99;opacity:0;
    transition:opacity .25s, transform .25s;
    border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <div class="app-head">
    <div class="app-title">
      <div class="logo"></div>
      <div>FeatherTune Card Maker<small>楽曲魅力カード ジェネレーター</small></div>
    </div>
    <a class="lp-mini" href="https://feathertune.com" target="_blank" rel="noopener">feathertune.com →</a>
  </div>

  <!-- Drop zone -->
  <div class="drop" id="drop" role="button" tabindex="0" aria-label="HTMLファイルを選択">
    <span class="ico">📁</span>
    <span class="ttl">FeatherTune解析HTMLをドロップ または クリックで選択</span>
    <span class="sub">.html ファイルを読み込むと自動でカードが生成されます</span>
    <span class="pick-btn" id="pickBtn">ファイルを選ぶ</span>
    <span id="loadedPill" style="display:none"></span>
  </div>
  <input type="file" id="file" accept=".html,text/html" class="visually-hidden">

  <div class="layout">
    <!-- Editor -->
    <div class="editor">
      <h3>基本情報</h3>
      <div class="field"><label>曲名</label><input id="f-title" type="text"></div>
      <div class="field"><label>アーティスト</label><input id="f-artist" type="text"></div>
      <div class="field"><label>サマリ（1行説明）</label><textarea id="f-summary"></textarea></div>

      <h3>スコア</h3>
      <div class="grid3">
        <div class="field"><label>CRS</label><input id="f-crs" type="number" min="0" max="100"></div>
        <div class="field"><label>Music</label><input id="f-music" type="number" min="0" max="100"></div>
        <div class="field"><label>Lyrics</label><input id="f-lyrics" type="number" min="0" max="100"></div>
      </div>
      <div class="field" style="max-width:160px"><label>Rank</label><input id="f-rank" type="text"></div>

      <h3>楽曲スペック</h3>
      <div class="grid2">
        <div class="field"><label>Key</label><input id="f-key" type="text"></div>
        <div class="field"><label>Tempo (BPM)</label><input id="f-tempo" type="text"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Key 補足</label><input id="f-key-sub" type="text" placeholder="例: → B♭マイナーへ転調"></div>
        <div class="field"><label>Tempo 補足</label><input id="f-tempo-sub" type="text" placeholder="例: 適度な推進力"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Main Progression</label><input id="f-prog" type="text"></div>
        <div class="field"><label>Genre</label><input id="f-genre" type="text"></div>
      </div>

      <h3>魅力ポイント（4つ）</h3>
      <div class="charm-edit" id="charmEdit"></div>

      <h3>象徴フレーズ（歌詞）</h3>
      <div class="field"><textarea id="f-lyric" placeholder="心に残るフレーズを2行程度"></textarea></div>
    </div>

    <!-- Preview + Actions -->
    <div class="preview-wrap">
      <div class="preview-frame" id="previewFrame">
        <div class="card-stage" id="card"></div>
      </div>

      <div class="actions row5">
        <button class="abtn primary" id="btn-html" type="button" title="単体HTMLとしてダウンロード">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          HTML
        </button>
        <button class="abtn primary" id="btn-png" type="button" title="PNG画像として保存">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          PNG
        </button>
        <button class="abtn x" id="btn-x" type="button" title="Xで画像シェア">

<script>
/* =========================================================
   初期状態：完全に空。HTMLをドロップして初めて中身が入る
   ========================================================= */
function emptyData(){
  return {
    title:'', artist:'', summary:'',
    crs:null, music:null, lyrics:null, rank:'',
    key:'', keySub:'', tempo:'', tempoSub:'',
    prog:'', genre:'',
    reportId:'', reportDate:'',
    charm:[
      {icon:'💫', title:'', desc:''},
      {icon:'💫', title:'', desc:''},
      {icon:'💫', title:'', desc:''},
      {icon:'💫', title:'', desc:''},
    ],
    lyric:'',
    _loaded:false
  };
}
const ICON_POOL = ['🌌','🎼','✨','🕊️','💫','🎵','🌠','🪞','🔥','🌙','💎','🌈'];

let DATA = emptyData();

/* =========================================================
   Parser: FeatherTune Analysis HTML → data
   ========================================================= */
function parseFeatherTuneHtml(html){
  // Sanitize: remove img/svg/style/script
  let t = html
    .replace(/<img[^>]*>/g,'')
    .replace(/<svg[\s\S]*?<\/svg>/g,'')
    .replace(/<style[\s\S]*?<\/style>/g,'')
    .replace(/<script[\s\S]*?<\/script>/g,'');
  t = t.replace(/<[^>]+>/g,'\n');
  // decode entities
  const decoder = document.createElement('div');
  decoder.innerHTML = t;
  t = decoder.textContent || decoder.innerText || t;

  const lines = t.split('\n').map(s=>s.trim()).filter(Boolean);

  // 完全に空の状態から組み立て。見つからなければ空のまま
  const result = emptyData();
  result.charm = [];
  result._loaded = true;

  // 曲名 / アーティスト
  for (const l of lines){
    if (!result.title){
      const m = l.match(/^曲名[：:]\s*(.+)$/);
      if (m) result.title = m[1].replace(/（[^）]*）$/,'').trim();
    }
    if (!result.artist){
      const m = l.match(/^アーティスト名?[：:]\s*(.+)$/);
      if (m) result.artist = m[1].replace(/（[^）]*）$/,'').trim();
    }
  }

  // Score labels: 「Lyrics Score」「Music Score」「CRS」 → 直後の "85 / 100" を取得
  function scoreAfter(label){
    for (let i=0;i<lines.length;i++){
      if (lines[i] === label || lines[i].startsWith(label)){
        for (let j=i+1;j<Math.min(i+4, lines.length);j++){
          const m = lines[j].match(/^(\d+)\s*\/\s*\d+/);
          if (m) return parseInt(m[1],10);
          const m2 = lines[j].match(/^(\d+)$/);
          if (m2) return parseInt(m2[1],10);
        }
      }
    }
    return null;
  }
  result.lyrics = scoreAfter('Lyrics Score');
  result.music = scoreAfter('Music Score');
  result.crs = scoreAfter('CRS');

  // Rank — "Rank" 行直後の英字1〜2文字
  for (let i=0;i<lines.length;i++){
    if (lines[i] === 'Rank' && i+1<lines.length){
      const v = lines[i+1].trim();
      if (/^[A-Za-z][\+\-]?$/.test(v)) { result.rank = v; break; }
    }
  }

  // Key / Tempo from "Key: ..." "Tempo: ..."
  for (const l of lines){
    let m = l.match(/^Key[：:]\s*(.+)$/i);
    if (m && !result.key) result.key = m[1].trim();
    m = l.match(/^Tempo[：:]\s*([\d.]+)/i);
    if (m && !result.tempo) result.tempo = m[1].trim();
  }

  // Main Progression — 見出し直後
  for (let i=0;i<lines.length;i++){
    if (lines[i] === 'MAIN PROGRESSION' && i+1<lines.length){
      result.prog = lines[i+1].trim(); break;
    }
  }

  // Summary — 「■ 一言評価」直後（無ければ SUMMARY 直後）
  for (let i=0;i<lines.length;i++){
    if (lines[i].startsWith('■ 一言評価') && i+1<lines.length){
      result.summary = lines[i+1].trim(); break;
    }
  }
  if (!result.summary){
    for (let i=0;i<lines.length;i++){
      if (lines[i] === 'SUMMARY' && i+1<lines.length){
        result.summary = lines[i+1].trim(); break;
      }
    }
  }

  // Type (表現称号) — 4つ目補完用
  let typeName = '';
  for (const l of lines){
    const m = l.match(/表現称号は「(.+?)」/);
    if (m){ typeName = m[1]; break; }
  }

  // ジャンル/評価タイプ — 「■ 評価タイプ」最優先
  for (let i=0;i<lines.length;i++){
    if (lines[i].startsWith('■ 評価タイプ') && i+1<lines.length){
      const v = lines[i+1].trim();
      if (v && v.length <= 60){ result.genre = v; break; }
    }
  }

  // 魅力ポイント — セクション範囲の特定（より堅牢）
  // 開始: 「魅力として評価できるポイント」「魅力ポイント」「9. 〜魅力〜」
  // 終端: 「10. 」「11. 」「改善余地」「総合評価」「評価項目」「総評」「○. 」
  let charmStart = -1, charmEnd = lines.length;
  for (let i=0;i<lines.length;i++){
    if (charmStart < 0){
      if (/魅力として評価できるポイント|^魅力ポイント$|^9\..*魅力|^魅力[\s:：]/.test(lines[i])){
        charmStart = i + 1;
      }
    } else {
      if (/^(10\.|11\.|12\.)/.test(lines[i]) ||
          /^(改善余地|総合評価|総評|評価項目|改善|今後の伸びしろ)/.test(lines[i]) ||
          /^■\s*(改善|総合|評価|総評)/.test(lines[i]) ||
          /^📋|^📊|^⭐|^🔍|^⚖|^💡|^🔬|^📰/.test(lines[i])){
        charmEnd = i; break;
      }
    }
  }

  if (charmStart > 0){
    const section = lines.slice(charmStart, charmEnd);
    const seen = new Set();

    // タイトル候補かどうかの簡易判定
    function looksLikeTitle(s){
      if (!s) return false;
      const len = s.length;
      if (len < 3 || len > 60) return false;
      // 「。」を含む文章っぽいものは除外
      if (/。/.test(s)) return false;
      // セクション見出しっぽいものは除外
      if (/^(■|●|▶|◆|◇|—|–|・)/.test(s) && len > 30) return false;
      if (/評価項目|総合コメント|総評|改善|今後の|データソース|分析項目|解析項目/.test(s)) return false;
      return true;
    }
    function cleanTitle(s){
      return s.replace(/^[■●▶◆◇\s]+/,'')
              .replace(/^[\d.\s①②③④⑤⑥⑦⑧⑨⑩\(（）)]+/,'')
              .replace(/[：:]\s*$/,'')
              .trim();
    }

    for (let i=0;i<section.length;i++){
      const l = section[i];
      let title = null, desc = null, consumed = 1;

      // ===== パターンA: "タイトル：説明文" 同一行 =====
      let m = l.match(/^[・●■◆★◇▶▼□]?\s*[①②③④⑤⑥⑦⑧⑨⑩\(（\d\)）.\s]*([^：:]{3,60})[：:]\s*(.{15,})$/);
      if (m){
        title = cleanTitle(m[1]);
        desc  = m[2].trim();
      }

      // ===== パターンB: "タイトル：" 単独行 → 次行が説明 =====
      if (!title){
        m = l.match(/^[・●■◆★◇▶▼□]?\s*[①②③④⑤⑥⑦⑧⑨⑩\(（\d\)）.\s]*([^：:]{3,60})[：:]\s*$/);
        if (m && i+1<section.length){
          const next = section[i+1];
          if (next.length >= 10 && !/[：:]\s*$/.test(next)){
            title = cleanTitle(m[1]);
            desc  = next.replace(/^[：:]\s*/,'').trim();
            consumed = 2;
          }
        }
      }

      // ===== パターンC: タイトル単独行 + 次行が「：説明文」（みあげてごらん形式） =====
      if (!title && looksLikeTitle(l) && i+1<section.length){
        const next = section[i+1];
        if (/^[：:]\s*\S/.test(next)){
          title = cleanTitle(l);
          desc  = next.replace(/^[：:]\s*/,'').trim();
          consumed = 2;
        }
      }

      // ===== パターンD: タイトル単独行 + 次行が長い説明文（コロンなし） =====
      if (!title && looksLikeTitle(l) && i+1<section.length){
        const next = section[i+1];
        // 次行が十分長く、タイトルっぽくない（句点を含む等）
        if (next.length >= 30 && /。/.test(next) && !looksLikeTitle(next)){
          title = cleanTitle(l);
          desc  = next.replace(/^[：:]\s*/,'').trim();
          consumed = 2;
        }
      }

      if (title){
        if (title.length < 2 || title.length > 60) title = null;
        if (title && /評価項目|総合|総評|改善|今後の/.test(title)) title = null;
      }

      if (title && desc && !seen.has(title)){
        seen.add(title);
        result.charm.push({ icon:'💫', title, desc });
        i += consumed - 1;
      }
    }
  }

  // 4つに満たない場合: 表現称号を1つ補い、残りは空欄
  while (result.charm.length < 4){
    if (typeName){
      result.charm.push({icon:'🕊️', title:'表現スタイル', desc:typeName});
      typeName = '';
    } else {
      result.charm.push({icon:'💫', title:'', desc:''});
    }
  }
  result.charm = result.charm.slice(0,4);

  // アイコンをテーマ別に自動割当（空タイトルは💫のまま）
  const guess = (title) => {
    if (!title) return '💫';
    if (/テーマ|メッセージ|哲学|世界観|歌詞|物語/.test(title)) return '🌌';
    if (/構成|転調|ドラマ|クライマックス|展開|構造/.test(title)) return '🎼';
    if (/和声|コード|進行|サウンド|キャッチ|メロディ/.test(title)) return '✨';
    if (/ボーカル|歌唱|表現|声|演奏/.test(title)) return '🕊️';
    if (/リズム|テンポ|グルーヴ|ビート/.test(title)) return '🥁';
    if (/愛|希望|光|想い|心/.test(title)) return '💖';
    return '💫';
  };
  result.charm.forEach(c => { c.icon = guess(c.title); });

  // 象徴フレーズ — 「[長いフレーズ…] 〜」を2行
  const phrases = [];
  for (const l of lines){
    const m = l.match(/^\[長いフレーズ[^\]]*\]\s*(.+)$/);
    if (m) phrases.push(m[1].trim());
  }
  if (phrases.length >= 2){
    result.lyric = `${phrases[0]}\n${phrases[1]}`;
  } else if (phrases.length === 1){
    result.lyric = phrases[0];
  }

  // Report ID / Date
  for (const l of lines){
    let m = l.match(/レポートID[：:]\s*(\S+)/);
    if (m && !result.reportId) result.reportId = m[1];
    m = l.match(/作成日[：:]\s*(\S+)/);
    if (m && !result.reportDate) result.reportDate = m[1];
  }

  return result;
}

function shareText(d){
  const parts = [];
  if (d.title) parts.push(`🌌 ${d.title}${d.artist?` — ${d.artist}`:''}`);
  if (d.summary) parts.push(d.summary);
  const scoreLine = [];
  if (d.crs != null) scoreLine.push(`CRS ${d.crs}${d.rank?` / Rank ${d.rank}`:''}`);
  if (d.music != null) scoreLine.push(`Music ${d.music}`);
  if (d.lyrics != null) scoreLine.push(`Lyrics ${d.lyrics}`);
  if (scoreLine.length) parts.push(scoreLine.join(' · '));
  const tags = ['#FeatherTune'];
  if (d.title) tags.unshift('#' + d.title.replace(/\s+/g,''));
  if (d.artist) tags.splice(1,0,'#' + d.artist.replace(/\s+/g,''));
  parts.push(tags.join(' '));
  return parts.join('\n');
}

// file://環境やlocalhostではfeathertune.comを共有URLに使う
function shareUrl(){
  const proto = location.protocol;
  if (proto === 'file:' || /^localhost|^127\./.test(location.host)){
    return 'https://feathertune.com';
  }
  return location.href;
}

// ===== PNG生成（共通） =====
async function generateCardPngBlob(){
  if (!window.html2canvas) throw new Error('html2canvas not loaded');
  const node = document.getElementById('card');
  const clone = node.cloneNode(true);
  clone.style.width = '440px';
  clone.style.maxWidth = '440px';
  const sandbox = document.createElement('div');
  sandbox.style.cssText = 'position:fixed;left:-9999px;top:0;width:440px;z-index:-1';
  sandbox.appendChild(clone);
  document.body.appendChild(sandbox);
  try {
    const canvas = await html2canvas(clone, { backgroundColor:'#050218', scale:2, useCORS:true, logging:false });
    return await new Promise(res => canvas.toBlob(res, 'image/png'));
  } finally {
    document.body.removeChild(sandbox);
  }
}

function safeFilename(){
  return (DATA.title||'card').replace(/[\\\/:*?"<>|]/g,'_').replace(/\s+/g,'_');
}

function downloadPng(blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `FT_card_${safeFilename()}.png`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

// ===== 統合シェア関数 =====
async function shareToPlatform(platform){
  if (!DATA._loaded && !DATA.title){
    showToast('先にHTMLを読み込むか入力してください');
    return;
  }
  const text = shareText(DATA);
  const url = shareUrl();
  showToast('画像を生成中…');

  // 1) PNGを生成
  let pngFile = null;
  try {
    const blob = await generateCardPngBlob();
    pngFile = new File([blob], `FT_card_${safeFilename()}.png`, {type:'image/png'});
  } catch(e){
    console.error('PNG生成失敗:', e);
  }

  // 2) Web Share API (files) を最優先 — モバイルで一発投稿可能
  if (pngFile && navigator.canShare && navigator.canShare({files:[pngFile]})){
    try {
      await navigator.share({files:[pngFile], text:text, title:DATA.title||'FeatherTune Card', url:url});
      showToast('✓ 共有しました');
      return;
    } catch(e){
      if (e.name === 'AbortError') return;
      console.warn('Web Share失敗、フォールバック:', e);
    }
  }

  // 3) フォールバック: PNGをDL → 投稿画面を開く
  if (pngFile){
    downloadPng(pngFile);
  }

  if (platform === 'x'){
    const composeUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text + '\n' + url);
    window.open(composeUrl, '_blank', 'noopener');
    showToast(pngFile ? '✓ 画像をDLしました。Xの投稿画面で添付してください' : 'Xを開きました');
  } else if (platform === 'line'){
    const composeUrl = 'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
    window.open(composeUrl, '_blank', 'noopener');
    showToast(pngFile ? '✓ 画像をDLしました。LINEで添付してください' : 'LINEを開きました');
  } else if (platform === 'ig'){
    try { await navigator.clipboard.writeText(text + '\n' + url); } catch(e){}
    setTimeout(()=>{ window.location.href='instagram://app'; }, 600);
    showToast(pngFile ? '✓ 画像をDLしました。Instagramを開いて添付してください' : 'テキストをコピー、Instagramを起動します');
  }
}

function renderAll(){
  document.getElementById('card').innerHTML = renderCardInner(DATA);
}

/* =========================================================
   Form ⇄ Data binding
   ========================================================= */
function buildCharmEditor(){
  const wrap = document.getElementById('charmEdit');
  wrap.innerHTML = '';
  DATA.charm.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="row1">
        <input data-bind="charm.${i}.icon" type="text" value="${escapeHtml(c.icon)}" maxlength="2">
        <input data-bind="charm.${i}.title" type="text" value="${escapeHtml(c.title)}" placeholder="魅力タイトル">
      </div>
      <textarea data-bind="charm.${i}.desc" placeholder="説明文">${escapeHtml(c.desc)}</textarea>
    `;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('[data-bind]').forEach(el => {
    el.addEventListener('input', onBindInput);
  });
}

function onBindInput(e){
  const path = e.target.getAttribute('data-bind');
  const val = e.target.value;
  if (path.startsWith('charm.')){
    const [, idx, key] = path.split('.');
    DATA.charm[+idx][key] = val;
  } else {
    DATA[path] = (e.target.type === 'number') ? (val === '' ? null : Number(val)) : val;
  }
  renderAll();
}

function fillForm(){
  const map = {
    'f-title':'title','f-artist':'artist','f-summary':'summary',
    'f-crs':'crs','f-music':'music','f-lyrics':'lyrics','f-rank':'rank',
    'f-key':'key','f-key-sub':'keySub','f-tempo':'tempo','f-tempo-sub':'tempoSub',
    'f-prog':'prog','f-genre':'genre','f-lyric':'lyric'
  };
  Object.keys(map).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = DATA[map[id]] ?? '';
    el.setAttribute('data-bind', map[id]);
    el.removeEventListener('input', onBindInput);
    el.addEventListener('input', onBindInput);
  });
  buildCharmEditor();
}

/* =========================================================
   File upload
   ========================================================= */
function handleFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      DATA = parseFeatherTuneHtml(e.target.result);
      fillForm(); renderAll();

      // 抽出件数のレポート
      const filled = DATA.charm.filter(c => c.title && c.title.trim()).length;
      const pill = document.getElementById('loadedPill');
      pill.className = 'loaded-pill';
      pill.style.display = 'inline-flex';
      let pillMsg = `✓ ${escapeHtml(DATA.title || file.name)} 読み込み完了`;
      if (filled < 4){
        pillMsg += `　<span style="color:#ffd57a">⚠ 魅力ポイント ${filled}/4 抽出</span>`;
      } else {
        pillMsg += `　<span style="color:#a8f5c8">魅力 ${filled}/4 抽出</span>`;
      }
      pill.innerHTML = pillMsg;

      showToast(`✓ "${DATA.title || file.name}" を読み込みました（魅力 ${filled}/4）`);
      window.scrollTo({top:0, behavior:'smooth'});
    } catch(err){
      console.error(err);
      showToast('読み込みに失敗しました');
    }
  };
  reader.readAsText(file, 'utf-8');
}

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
function openPicker(e){
  if (e) { e.preventDefault(); e.stopPropagation(); }
  fileInput.value = ''; // 同じファイルを再選択できるようにリセット
  fileInput.click();
}
drop.addEventListener('click', openPicker);
drop.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') openPicker(e);
});
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});

/* =========================================================
   Export: Standalone HTML
   ========================================================= */
function buildStandaloneHtml(d){
  const cardInner = renderCardInner(d);
  const css = document.querySelector('style').textContent;
  const safeName = (d.title||'card').replace(/[\\\/:*?"<>|]/g,'_').replace(/\s+/g,'_');
  return `<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0628">
<title>${escapeHtml(d.title)} / ${escapeHtml(d.artist)} — FeatherTune</title>
<meta property="og:title" content="${escapeHtml(d.title)} — ${escapeHtml(d.artist)}">
<meta property="og:description" content="${escapeHtml(d.summary)}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>
<style>
body{margin:0;background:#050218}
.card-stage{max-width:440px;margin:0 auto}
.ft-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:12.5px;letter-spacing:.06em;z-index:99;opacity:0;
  transition:opacity .25s, transform .25s;
  border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.ft-toast.show{opacity:1;transform:translate(-50%,0)}
${css}
</style>
</head><body>
<div class="card-stage" id="card">${cardInner}</div>
<div class="ft-toast" id="ftToast"></div>
<script>
(function(){
  var DATA = ${JSON.stringify(d)};
  var text = ${JSON.stringify(shareText(d))};
  function getShareUrl(){
    var p = location.protocol;
    if (p === 'file:' || /^localhost|^127\\./.test(location.host)) return 'https://feathertune.com';
    return location.href;
  }
  var toastTimer;
  function toast(msg){
    var t = document.getElementById('ftToast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function safeName(){
    return (DATA.title||'card').replace(/[\\\\\\/:*?"<>|]/g,'_').replace(/\\s+/g,'_');
  }
  async function genPng(){
    if (!window.html2canvas) throw new Error('html2canvas未読込');
    var node = document.getElementById('card');
    var clone = node.cloneNode(true);
    clone.style.width = '440px'; clone.style.maxWidth = '440px';
    var sandbox = document.createElement('div');
    sandbox.style.cssText = 'position:fixed;left:-9999px;top:0;width:440px;z-index:-1';
    sandbox.appendChild(clone); document.body.appendChild(sandbox);
    try {
      var canvas = await html2canvas(clone, { backgroundColor:'#050218', scale:2, useCORS:true, logging:false });
      return await new Promise(function(res){ canvas.toBlob(res, 'image/png'); });
    } finally { document.body.removeChild(sandbox); }
  }
  function dlPng(blob){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'FT_card_' + safeName() + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  }
  async function share(platform){
    var url = getShareUrl();
    toast('画像を生成中…');
    var pngFile = null;
    try {
      var blob = await genPng();
      pngFile = new File([blob], 'FT_card_' + safeName() + '.png', {type:'image/png'});
    } catch(e){ console.error(e); }
    if (pngFile && navigator.canShare && navigator.canShare({files:[pngFile]})){
      try { await navigator.share({files:[pngFile], text:text, title:DATA.title||'FeatherTune Card', url:url}); toast('✓ 共有しました'); return; }
      catch(e){ if (e.name==='AbortError') return; }
    }
    if (pngFile) dlPng(pngFile);
    if (platform === 'x'){
      window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text + '\\n' + url), '_blank', 'noopener');
      toast(pngFile ? '✓ 画像をDLしました。Xで添付してください' : 'Xを開きました');
    } else if (platform === 'line'){
      window.open('https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text), '_blank', 'noopener');
      toast(pngFile ? '✓ 画像をDLしました。LINEで添付してください' : 'LINEを開きました');
    } else if (platform === 'ig'){
      try { await navigator.clipboard.writeText(text + '\\n' + url); } catch(e){}
      setTimeout(function(){ window.location.href = 'instagram://app'; }, 600);
      toast(pngFile ? '✓ 画像をDLしました。Instagramで添付してください' : 'Instagramを起動します');
    }
  }
  document.getElementById('card').addEventListener('click', function(e){
    var t = e.target.closest('a, [data-action]'); if (!t) return;
    if (t.id === 'card-x'){ e.preventDefault(); share('x'); }
    else if (t.id === 'card-line'){ e.preventDefault(); share('line'); }
    else if (t.id === 'card-ig'){ e.preventDefault(); share('ig'); }
    else if (t.id === 'card-copy'){
      e.preventDefault();
      navigator.clipboard.writeText(text + '\\n' + getShareUrl()).then(function(){ toast('✓ テキストをコピーしました'); });
    }
  });
})();
<\/script>
</body></html>`;
}

function downloadHtml(){
  const html = buildStandaloneHtml(DATA);
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const safe = (DATA.title||'card').replace(/[\\\/:*?"<>|]/g,'_');
  a.download = `FT_card_${safe}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  showToast('HTMLをダウンロードしました');
}

async function savePng(){
  if (!window.html2canvas){ showToast('PNGライブラリ未読込'); return; }
  showToast('画像を生成中…');
  try {
    const blob = await generateCardPngBlob();
    downloadPng(blob);
    showToast('✓ PNGを保存しました');
  } catch(e){
    console.error(e);
    showToast('PNG生成に失敗しました');
  }
}

/* =========================================================
   Action bar wiring
   ========================================================= */
document.getElementById('btn-html').addEventListener('click', downloadHtml);
document.getElementById('btn-png').addEventListener('click', savePng);
document.getElementById('btn-x').addEventListener('click', () => shareToPlatform('x'));
document.getElementById('btn-line').addEventListener('click', () => shareToPlatform('line'));
document.getElementById('btn-ig').addEventListener('click', () => shareToPlatform('ig'));

/* preview内のシェアボタン (delegated) */
document.getElementById('card').addEventListener('click', async e => {
  const target = e.target.closest('a, [data-action]');
  if (!target) return;
  const id = target.id;
  if (id === 'card-x'){ e.preventDefault(); shareToPlatform('x'); return; }
  if (id === 'card-line'){ e.preventDefault(); shareToPlatform('line'); return; }
  if (id === 'card-ig'){ e.preventDefault(); shareToPlatform('ig'); return; }
  if (id === 'card-copy'){
    e.preventDefault();
    try { await navigator.clipboard.writeText(shareText(DATA) + '\n' + shareUrl()); showToast('テキストをコピーしました'); } catch(_){}
  }
});

/* =========================================================
   Toast
   ========================================================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* =========================================================
   Init
   ========================================================= */
fillForm();
renderAll();
</script>
</body>
</html>
